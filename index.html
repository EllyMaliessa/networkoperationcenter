<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Operation Center – IMS613</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e12;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#e8eef5}
canvas{display:block;touch-action:none;cursor:grab}
button{font:inherit;color:#e8eef5;background:#1c2530;border:1px solid #33465a;border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover,button.on{background:#0f6b8a;border-color:#4fc3e8}
button:focus-visible{outline:2px solid #ffb02e;outline-offset:2px}
#hud{position:fixed;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:70vw}
#cap{position:fixed;left:16px;bottom:16px;max-width:min(580px,calc(100vw - 32px));background:rgba(11,16,22,.84);border-left:4px solid #4fc3e8;padding:12px 16px;border-radius:4px}
#cap h2{margin:0 0 4px;font-size:18px}#cap p{margin:0;font-size:14px;line-height:1.5;color:#c9d6e2}
#hint{position:fixed;left:16px;top:12px;font-size:12px;color:#8fa3b5}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,9,13,.93);z-index:5}
#intro .card{display:grid;grid-template-columns:150px 1fr;gap:20px;max-width:760px;width:calc(100% - 32px);padding:24px;background:#121a23;border:1px solid #2b3c4d;border-radius:8px}
#intro img{width:100%;object-fit:contain;border-radius:4px;background:#1c2530;min-height:60px}
#intro .col{display:flex;flex-direction:column;gap:12px;align-items:center}
#intro h1{margin:0 0 4px;font-size:22px}#intro table{border-collapse:collapse;font-size:14px;margin:10px 0 16px}
#intro td{padding:3px 10px 3px 0;vertical-align:top}#intro td:first-child{color:#8fa3b5;white-space:nowrap}
@media(max-width:560px){#intro .card{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="hint">Drag: look around · W A S D / arrows: walk · Scroll: zoom · H: hide interface</div>
<div id="hud"></div>
<div id="cap"><h2></h2><p></p></div>
<div id="intro"><div class="card">
  <div class="col"><img src="assets/uitm-logo.png" alt="UiTM logo"><img src="assets/photo.jpg" alt="Student photo"></div>
  <div><h1>Network Operation Center (NOC)</h1><div style="color:#8fa3b5;font-size:14px">3D 360° room tour · Three.js</div>
  <table id="info"></table><button id="go">Enter room</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== EDIT YOUR DETAILS HERE =====
const STUDENT = {
  "Full name":"YOUR FULL NAME",
  "Student ID":"2024XXXXXX",
  "Program code":"CDIM262",
  "Course":"IMS613 – Data Center Management",
  "Group":"CDIM2629A",
  "Faculty":"Faculty of Information Science, UiTM",
  "Prepared for":"LECTURER NAME",
  "Date":"DD Month YYYY"
};
// ===================================
const T=THREE,$=id=>document.getElementById(id);
$('info').innerHTML=Object.entries(STUDENT).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
document.querySelectorAll('#intro img').forEach(i=>i.onerror=()=>i.style.display='none');

const scene=new T.Scene();scene.background=new T.Color(0x0b0e12);
const camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.05,100);camera.rotation.order='YXZ';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);

const M=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:.1},o));
const B=c=>new T.MeshBasicMaterial({color:c});
const box=(w,h,d,m,x,y,z,p=scene)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o};
const cyl=(r,h,m,x,y,z,p=scene,rx=0,rz=0)=>{const o=new T.Mesh(new T.CylinderGeometry(r,r,h,16),m);o.position.set(x,y,z);o.rotation.set(rx,0,rz);p.add(o);return o};
function ctex(w,h,draw,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;return t}
function tplane(w,h,tex,x,y,z,ry=0){const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex}));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m);return m}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- Room dimensions (24 m × 18 m, ceiling 5.2 m) ----------
const ROOM={W:24,D:18,H:5.2};
const HW=ROOM.W/2;   // 12
const HD=ROOM.D/2;   // 9
const CH=ROOM.H;     // 5.2

// ---------- Lights ----------
scene.add(new T.HemisphereLight(0xcfe0f5,0x1c2229,.6));
[[-HW*.5,CH-1.6,-HD*.5],[HW*.5,CH-1.6,-HD*.5],[-HW*.5,CH-1.6,HD*.5],[HW*.5,CH-1.6,HD*.5]].forEach(p=>{const l=new T.PointLight(0xe6f0ff,.5,26);l.position.set(...p);scene.add(l)});
const wl=new T.PointLight(0x4fc3e8,.9,18);wl.position.set(0,CH-1.4,-HD+2);scene.add(wl);

// ---------- Shell ----------
const carpet=ctex(128,128,(g,w,h)=>{g.fillStyle='#2c3846';g.fillRect(0,0,w,h);for(let i=0;i<900;i++){g.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'0,0,0'},.07)`;g.fillRect(Math.random()*w,Math.random()*h,2,2)}g.strokeStyle='rgba(0,0,0,.25)';g.strokeRect(0,0,w,h)},48,36);
const floor=new T.Mesh(new T.PlaneGeometry(ROOM.W,ROOM.D),new T.MeshStandardMaterial({map:carpet,roughness:.95}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const wallM=M(0xcdd4da,{roughness:.9}),darkWall=M(0x1c242c,{roughness:.9});
[[0,-HD,0,ROOM.W,darkWall],[0,HD,Math.PI,ROOM.W,wallM],[-HW,0,Math.PI/2,ROOM.D,wallM],[HW,0,-Math.PI/2,ROOM.D,wallM]].forEach(([x,z,r,w,m])=>{
  const p=new T.Mesh(new T.PlaneGeometry(w,CH),m);p.rotation.y=r;p.position.set(x,CH/2,z);scene.add(p)});
const tileTex=ctex(64,64,(g,w,h)=>{g.fillStyle='#e9edf0';g.fillRect(0,0,w,h);for(let i=0;i<120;i++){g.fillStyle='rgba(0,0,0,.05)';g.fillRect(Math.random()*w,Math.random()*h,2,2)}g.strokeStyle='#9aa4ac';g.lineWidth=3;g.strokeRect(0,0,w,h)},40,30);
const ceil=new T.Mesh(new T.PlaneGeometry(ROOM.W,ROOM.D),new T.MeshStandardMaterial({map:tileTex}));ceil.rotation.x=Math.PI/2;ceil.position.y=CH;scene.add(ceil);
const troff=B(0xcfe3f5);[-9,-4.5,0,4.5,9].forEach(x=>[-6.7,-2.2,2.2,6.7].forEach(z=>box(1.8,.03,.9,troff,x,CH-.02,z)));

// raised tiers (scale)
const platM=M(0x26313d,{roughness:.95}),edgeM=B(0x4fc3e8);
box(ROOM.W,.2,ROOM.D*.515,platM,0,.1,ROOM.D*.2575);
box(ROOM.W,.4,ROOM.D*.285,platM,0,.2,ROOM.D*.3575);
box(ROOM.W,.015,.04,edgeM,0,.2,-ROOM.D*.014);
box(ROOM.W,.015,.04,edgeM,0,.4,ROOM.D*.216);
const tier=z=>z>ROOM.D*.215?.4:z>-ROOM.D*.015?.2:0;

// ---------- Video Wall ----------
const WALL=[];
function screen(draw){const c=document.createElement('canvas');c.width=512;c.height=288;const t=new T.CanvasTexture(c);WALL.push({g:c.getContext('2d'),t,draw});return t}
const SC=['#31e981','#ffb02e','#ff4d4f'];
function frame(g,title){g.fillStyle='#0a1118';g.fillRect(0,0,512,288);g.fillStyle='#111c27';g.fillRect(0,0,512,30);g.fillStyle='#4fc3e8';g.fillRect(0,0,6,30);
  g.fillStyle='#e8eef5';g.font='600 16px sans-serif';g.textBaseline='middle';g.textAlign='left';g.fillText(title,16,16)}
const nodeSt=Array(10).fill(0);
const NP=[[256,120,'Core-SW01'],[256,200,'Core-SW02'],[110,90,'FW-01'],[400,90,'FW-02'],[60,190,'DC-Edge'],[450,190,'DR-Site'],[160,240,'Branch-KB'],[350,240,'Branch-JB'],[256,60,'ISP-A'],[256,260,'ISP-B']];
const E=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,4],[3,5],[1,6],[1,7],[0,8],[1,9],[8,2],[9,3]];
const bwA=Array(64).fill(50),bwB=Array(64).fill(30),alerts=[],devs=[['Core-SW01',35],['Core-SW02',42],['FW-01',58],['FW-02',51],['Edge-RT01',28],['Edge-RT02',33]];
const sites=['HQ','DR','KB','KL','JB','PG','KK','KCH','IPH','MLK','SB','KT'],siteSt=Array(12).fill(0),GV=[22,.1,3];
const apps=[['Web',.34,'#4fc3e8'],['Video',.24,'#ffb02e'],['Cloud',.18,'#31e981'],['VoIP',.12,'#b388ff'],['Other',.12,'#7a8a99']];
const AM=['Link down: Gi0/1 – Core-SW02','High CPU 87% – FW-01','BGP neighbour reset – ISP-A','Latency > 80 ms – Branch-KB','Interface flapping – Edge-RT03','UPS-A on battery – power room','Temp 31°C – Rack C2','Packet loss 2% – DR link','SNMP timeout – AP-14'];
const dTopo=g=>{frame(g,'Network topology – live status');E.forEach(([a,b])=>{g.strokeStyle=SC[Math.max(nodeSt[a],nodeSt[b])];g.lineWidth=2;g.beginPath();g.moveTo(NP[a][0],NP[a][1]);g.lineTo(NP[b][0],NP[b][1]);g.stroke()});
  NP.forEach(([x,y,n],i)=>{g.fillStyle=SC[nodeSt[i]];g.beginPath();g.arc(x,y,10,0,7);g.fill();g.fillStyle='#cfe0ee';g.font='11px sans-serif';g.textAlign='center';g.fillText(n,x,y+22)});g.textAlign='left'};
const dBw=g=>{frame(g,'Backbone bandwidth (Gbps)');g.strokeStyle='#1d2b39';for(let i=0;i<5;i++){g.beginPath();g.moveTo(20,50+i*50);g.lineTo(500,50+i*50);g.stroke()}
  [[bwA,'#4fc3e8'],[bwB,'#ffb02e']].forEach(([a,c])=>{g.strokeStyle=c;g.lineWidth=2;g.beginPath();a.forEach((v,i)=>{const x=20+i*7.5,y=260-v*2.2;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()});
  g.fillStyle='#4fc3e8';g.fillText('Inbound '+bwA[63].toFixed(0),20,276);g.fillStyle='#ffb02e';g.fillText('Outbound '+bwB[63].toFixed(0),140,276)};
const dAlert=g=>{frame(g,'Active alerts');g.font='13px sans-serif';alerts.slice(-9).forEach(([t,s,m],i)=>{const y=52+i*26;g.fillStyle=SC[s];g.beginPath();g.arc(20,y,6,0,7);g.fill();g.fillStyle='#8fa3b5';g.fillText(t,36,y);g.fillStyle='#e8eef5';g.fillText(m,100,y)})};
const dSite=g=>{frame(g,'Site health');sites.forEach((n,i)=>{const x=20+(i%4)*121,y=44+Math.floor(i/4)*80;g.fillStyle='#142230';g.fillRect(x,y,110,70);g.fillStyle=SC[siteSt[i]];g.fillRect(x,y,110,5);g.fillStyle='#e8eef5';g.font='600 18px sans-serif';g.fillText(n,x+10,y+36);g.font='12px sans-serif';g.fillStyle='#8fa3b5';g.fillText(['Online','Degraded','Down'][siteSt[i]],x+10,y+56)})};
const dGauge=g=>{frame(g,'Service quality');[['Latency',GV[0],60,'ms'],['Packet loss',GV[1],5,'%'],['Jitter',GV[2],30,'ms']].forEach(([n,v,mx,u],i)=>{const cx=90+i*166,cy=170,r=58;g.lineWidth=12;g.strokeStyle='#1d2b39';g.beginPath();g.arc(cx,cy,r,Math.PI,0);g.stroke();
  g.strokeStyle=v/mx>.7?SC[2]:v/mx>.45?SC[1]:SC[0];g.beginPath();g.arc(cx,cy,r,Math.PI,Math.PI+Math.PI*clamp(v/mx,0,1));g.stroke();g.fillStyle='#e8eef5';g.textAlign='center';g.font='600 22px sans-serif';g.fillText(v.toFixed(1)+u,cx,cy-8);g.font='13px sans-serif';g.fillStyle='#8fa3b5';g.fillText(n,cx,cy+28)});g.textAlign='left'};
const dDev=g=>{frame(g,'Device CPU load');devs.forEach(([n,v],i)=>{const y=52+i*38;g.fillStyle='#cfe0ee';g.font='13px sans-serif';g.fillText(n,20,y+10);g.fillStyle='#1d2b39';g.fillRect(120,y,330,18);g.fillStyle=v>75?SC[2]:v>55?SC[1]:SC[0];g.fillRect(120,y,3.3*v,18);g.fillStyle='#e8eef5';g.fillText(v.toFixed(0)+'%',462,y+10)})};
const dSla=g=>{frame(g,'Service level summary');[['99.98%','Uptime (30 d)'],[String(8+(alerts.length%9)),'Open tickets'],['22 min','Mean time to repair'],['0','Severity 1']].forEach(([v,l],i)=>{const x=20+(i%2)*245,y=48+Math.floor(i/2)*118;g.fillStyle='#142230';g.fillRect(x,y,230,105);g.fillStyle='#4fc3e8';g.font='600 40px sans-serif';g.fillText(v,x+16,y+48);g.fillStyle='#8fa3b5';g.font='14px sans-serif';g.fillText(l,x+16,y+84)})};
const dApp=g=>{frame(g,'Traffic by application');let a=-Math.PI/2;apps.forEach(([n,p,c],i)=>{g.fillStyle=c;g.beginPath();g.moveTo(150,165);g.arc(150,165,100,a,a+p*Math.PI*2);g.fill();a+=p*Math.PI*2;g.fillRect(300,60+i*34,14,14);g.fillStyle='#e8eef5';g.font='14px sans-serif';g.fillText(n+'  '+(p*100).toFixed(0)+'%',324,72+i*34)});g.fillStyle='#0a1118';g.beginPath();g.arc(150,165,52,0,7);g.fill()};
const wallTex=[dTopo,dBw,dAlert,dSite,dGauge,dDev,dSla,dApp].map(screen);
box(16.2,5.0,.08,M(0x0b0f14),0,3.1,-HD+.04);
wallTex.forEach((t,i)=>{const c=i%4,r=i<4?1:0;const m=new T.Mesh(new T.PlaneGeometry(3.9,2.2),new T.MeshBasicMaterial({map:t}));m.position.set(-5.85+c*3.9,r?4.2:2.05,-HD+.09);scene.add(m)});
box(16.2,.03,.05,edgeM,0,1.0,-HD+.1);
const beacon=new T.Group();beacon.position.set(-9.0,CH-.5,-HD+.15);scene.add(beacon);cyl(.1,.1,M(0xffa000,{emissive:0x884400}),0,0,0,beacon);box(.02,.06,.3,B(0xffe08a),0,.04,.1,beacon);
const sign=ctex(512,64,(g,w,h)=>{g.fillStyle='#0b1218';g.fillRect(0,0,w,h);g.fillStyle='#4fc3e8';g.font='600 34px sans-serif';g.textBaseline='middle';g.textAlign='center';g.fillText('NETWORK OPERATION CENTER  24×7',w/2,h/2)});
tplane(6.4,.8,sign,0,CH-.8,HD-.04,Math.PI);

// ---------- Operator Dashboards ----------
const dash=[0,1,2].map(i=>{const c=document.createElement('canvas');c.width=256;c.height=144;return{c,g:c.getContext('2d'),t:new T.CanvasTexture(c),i}});
function drawDash(d){const g=d.g;g.fillStyle='#0a1118';g.fillRect(0,0,256,144);g.fillStyle='#111c27';g.fillRect(0,0,256,14);
  if(d.i===1){for(let i=0;i<8;i++){g.fillStyle=SC[Math.random()<.12?1:0];g.fillRect(8+(i%4)*60,24+Math.floor(i/4)*50,52,42)}}
  else{g.strokeStyle=d.i?'#ffb02e':'#4fc3e8';g.lineWidth=2;g.beginPath();for(let i=0;i<32;i++){const y=110-rnd(10,80);i?g.lineTo(8+i*7.5,y):g.moveTo(8,y)}g.stroke();g.fillStyle='#8fa3b5';g.fillRect(8,126,rnd(40,200),4)}
  d.t.needsUpdate=true}

// ---------- Workstations ----------
const deskM=M(0xe9edf0,{roughness:.5}),legM=M(0x30363d),kbM=M(0x15181c),chairM=M(0x1c242d,{roughness:.9});
const monG=new T.BoxGeometry(.56,.33,.025),dk=M(0x0a0c0f);
const monMats=dash.map(d=>[dk,dk,dk,dk,new T.MeshBasicMaterial({map:d.t}),dk]);
function monitor(x,y,z,k){const m=new T.Mesh(monG,monMats[k%3]);m.position.set(x,y+1.11,z);scene.add(m);box(.05,.18,.05,legM,x,y+.85,z-.02);box(.22,.01,.16,legM,x,y+.765,z)}
function station(x,z,yb,k){
  box(1.4,.04,.8,deskM,x,yb+.74,z);box(.04,.72,.7,legM,x-.68,yb+.36,z);box(.04,.72,.7,legM,x+.68,yb+.36,z);box(1.3,.35,.02,legM,x,yb+.5,z-.35);
  monitor(x-.3,yb,z-.22,k);monitor(x+.3,yb,z-.22,k+1);box(.42,.015,.14,kbM,x-.05,yb+.77,z+.17);box(.05,.02,.08,kbM,x+.3,yb+.77,z+.17);
  const cy=(Math.random()-.5)*.5;const c=new T.Group();c.position.set(x+(Math.random()-.5)*.2,yb,z+.8);c.rotation.y=cy;scene.add(c);
  box(.46,.07,.46,chairM,0,.5,0,c);box(.44,.5,.06,chairM,0,.8,.22,c);cyl(.03,.3,legM,0,.28,0,c);cyl(.26,.03,legM,0,.05,0,c)}
let k=0;
// operator rows: scale to new size
[[-2.3,0],[1.7,.2],[5.6,.4]].forEach(([z,yb])=>[-9,-6.5,-4,4,6.5,9].forEach(x=>station(x,z,yb,k++)));

// Supervisor desk (scale)
box(3.4,.04,1.3,M(0x7a5c3e),0,.4+.74,7.0);box(.04,.72,1.0,legM,-1.68,.76,7.0);box(.04,.72,1.0,legM,1.68,.76,7.0);
[-1.0,0,1.0].forEach((o,i)=>monitor(o,.4,6.72,i));box(.14,.06,.2,legM,1.36,1.17,7.2);
{const c=new T.Group();c.position.set(0,.4,8.4);scene.add(c);box(.5,.07,.5,chairM,0,.5,0,c);box(.48,.6,.06,chairM,0,.85,.24,c);cyl(.03,.3,legM,0,.28,0,c);cyl(.28,.03,legM,0,.05,0,c)}

// ---------- Network Racks ----------
const cache={};
function dev(type,u){const key=type+u;if(cache[key])return cache[key];const W=600,H=50*u;
  return cache[key]=ctex(W,H,g=>{g.fillStyle={sw:'#2b313a',pp:'#1b1f27',cm:'#0c0d10',srv:'#3a3f46',odf:'#d9b82b'}[type];g.fillRect(0,0,W,H);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,0,W,3);
    if(type==='sw'){g.fillStyle='#0a0c0f';for(let r=0;r<2;r++)for(let c=0;c<12;c++)g.fillRect(190+c*30,8+r*20,24,14);g.fillRect(20,10,140,H-20)}
    if(type==='pp')for(let c=0;c<24;c++){g.fillStyle=c%4<2?'#2d7dd2':'#f2c230';g.fillRect(30+c*23,8,18,6);g.fillStyle='#07080a';g.fillRect(30+c*23,16,18,22)}
    if(type==='odf'){g.fillStyle='#8a6d00';for(let c=0;c<12;c++)g.fillRect(40+c*45,10,32,H-20)}
    if(type==='cm'){g.fillStyle='#2a2d33';for(let c=0;c<30;c++)g.fillRect(24+c*19,8,6,H-16)}
    if(type==='srv'){g.fillStyle='#111';for(let c=0;c<8;c++)g.fillRect(24+c*56,8,48,H-16)}})}
const ledPos=[],seq=[['sw',1],['cm',1],['pp',1],['sw',1],['cm',1],['srv',2],['srv',2],['odf',2]];
function rack(x,z,rot){const g=new T.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);box(.6,2,1,M(0x14171c,{roughness:.5}),0,1,0,g);
  let y=.12,i=0;while(true){const [t,u]=seq[i++%seq.length],h=u*.0445;if(y+h>1.95)break;const fm=new T.MeshStandardMaterial({map:dev(t,u),roughness:.5,metalness:.3});
    const o=new T.Mesh(new T.BoxGeometry(.54,h-.002,.02),[dk,dk,dk,dk,fm,dk]);o.position.set(0,y+h/2,.51);g.add(o);
    if(t==='sw')for(let r=0;r<2;r++)for(let c=0;c<12;c++)ledPos.push([g,-.25+c*.0125,y+h/2+(r?-.007:.012),.523]);y+=h}}
// rack row nearer the corner of the bigger room
rack(11.25,-7.2,-Math.PI/2);rack(11.25,-6.55,-Math.PI/2);rack(11.25,-5.9,-Math.PI/2);rack(11.25,-5.25,-Math.PI/2);
scene.updateMatrixWorld(true);
const leds=new T.InstancedMesh(new T.BoxGeometry(.008,.008,.004),new T.MeshBasicMaterial({color:0xffffff}),ledPos.length),dm=new T.Object3D(),cl=new T.Color();
ledPos.forEach(([g,lx,ly,lz],i)=>{dm.position.copy(g.localToWorld(new T.Vector3(lx,ly,lz)));dm.rotation.y=g.rotation.y;dm.updateMatrix();leds.setMatrixAt(i,dm.matrix);leds.setColorAt(i,cl.set(0x31e981))});scene.add(leds);
const LC=[0x31e981,0x31e981,0x31e981,0xffb02e,0x16301f];

const robots=[];
function makeRobot(color,eyeColor){
  const g=new T.Group();
  const bodyM=M(color,{metalness:.7,roughness:.25});
  const darkM=M(0x15181c,{metalness:.8,roughness:.3});
  const glow=B(eyeColor);
  // torso
  box(.42,.55,.28,bodyM,0,1.15,0,g);
  // chest core
  box(.16,.16,.02,glow,0,1.22,-.15,g);
  box(.28,.08,.02,M(0x333),0,1.0,-.15,g);
  // head
  const head=new T.Group();head.position.set(0,1.62,0);g.add(head);
  box(.34,.3,.3,bodyM,0,0,0,head);
  // visor
  box(.28,.1,.02,glow,0,.02,-.16,head);
  // antenna
  cyl(.015,.14,darkM,0,.22,0,head);
  box(.05,.05,.05,glow,0,.3,0,head);
  // arms (pivot groups)
  const armL=new T.Group();armL.position.set(-.26,1.32,0);g.add(armL);
  box(.1,.42,.12,bodyM,0,-.2,0,armL);
  box(.1,.1,.1,darkM,0,-.44,0,armL);
  const armR=new T.Group();armR.position.set(.26,1.32,0);g.add(armR);
  box(.1,.42,.12,bodyM,0,-.2,0,armR);
  box(.1,.1,.1,darkM,0,-.44,0,armR);
  // legs (pivot groups)
  const legL=new T.Group();legL.position.set(-.12,.88,0);g.add(legL);
  box(.13,.42,.15,darkM,0,-.21,0,legL);
  box(.14,.1,.22,darkM,0,-.44,-.03,legL);
  const legR=new T.Group();legR.position.set(.12,.88,0);g.add(legR);
  box(.13,.42,.15,darkM,0,-.21,0,legR);
  box(.14,.1,.22,darkM,0,-.44,-.03,legR);
  // wheel base (rolling)
  cyl(.12,.06,darkM,-.12,.05,0,g,0,Math.PI/2);
  cyl(.12,.06,darkM,.12,.05,0,g,0,Math.PI/2);
  g.userData={armL,armR,legL,legR,eyeColor,glow,phase:Math.random()*10};
  scene.add(g);robots.push(g);return g;
}

  // arms

  box(.09,.1,.09,skinM,0,-.42,0,armL);
  const armR=new T.Group();armR.position.set(.24,1.36,0);g.add(armR);
  box(.1,.4,.12,shirtM,0,-.18,0,armR);
  box(.09,.1,.09,skinM,0,-.42,0,armR);
  // legs
  if(seated){
    // seated legs: thighs forward, shins down
    box(.14,.16,.42,pantsM,-.1,.65,-.15,g);
    box(.14,.16,.42,pantsM,.1,.65,-.15,g);
    box(.14,.42,.14,pantsM,-.1,.35,-.36,g);
    box(.14,.42,.14,pantsM,.1,.35,-.36,g);
    // shoes
    box(.16,.08,.22,M(0x111),-.1,.12,-.42,g);
    box(.16,.08,.22,M(0x111),.1,.12,-.42,g);
    // seated arms angled forward
    armL.rotation.x=-1.1;armR.rotation.x=-1.1;
    armL.position.y=1.15;armR.position.y=1.15;
  }else{
    const legL=new T.Group();legL.position.set(-.1,.88,0);g.add(legL);
    box(.14,.4,.15,pantsM,0,-.2,0,legL);
    box(.14,.4,.15,pantsM,0,-.6,0,legL);
    box(.16,.08,.22,M(0x111),0,-.8,-.03,legL);
    const legR=new T.Group();legR.position.set(.1,.88,0);g.add(legR);
    box(.14,.4,.15,pantsM,0,-.2,0,legR);
    box(.14,.4,.15,pantsM,0,-.6,0,legR);
    box(.16,.08,.22,M(0x111),0,-.8,-.03,legR);
    g.userData.legL=legL;g.userData.legR=legR;
  }
  g.userData={armL,armR,head,seated,phase:Math.random()*10};
  scene.add(g);people.push(g);return g;
}

const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyH')toggleUI()});addEventListener('keyup',e=>keys[e.code]=0);
let drag=false,lx=0,ly=0;const cv=renderer.domElement;
cv.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing'};
addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab'});
addEventListener('pointermove',e=>{if(!drag)return;if(auto||tw)stopTour();yaw-=(e.clientX-lx)*.004;pitch=clamp(pitch-(e.clientY-ly)*.004,-1.4,1.4);lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{camera.fov=clamp(camera.fov+e.deltaY*.03,35,90);camera.updateProjectionMatrix()},{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ---------- Live Data ----------
function tick(){
  if(Math.random()<.4){const i=Math.random()*10|0;nodeSt[i]=Math.random()<.3?(Math.random()<.6?1:2):0}
  bwA.push(clamp(bwA[63]+rnd(-8,8),15,90));bwA.shift();bwB.push(clamp(bwB[63]+rnd(-6,6),10,70));bwB.shift();
  if(Math.random()<.7){const d=new Date(),sv=Math.random()<.2?2:Math.random()<.5?1:0;alerts.push([d.toTimeString().slice(0,8),sv,AM[Math.random()*AM.length|0]])}
  if(Math.random()<.3){const i=Math.random()*12|0;siteSt[i]=Math.random()<.2?(Math.random()<.7?1:2):0}
  GV[0]=clamp(GV[0]+rnd(-4,4),8,55);GV[1]=clamp(GV[1]+rnd(-.3,.3),0,4);GV[2]=clamp(GV[2]+rnd(-2,2),1,25);
  devs.forEach(d=>d[1]=clamp(d[1]+rnd(-6,6),10,95));
  WALL.forEach(w=>{w.draw(w.g);w.t.needsUpdate=true});dash.forEach(drawDash);drawWC();
  for(let i=0;i<ledPos.length;i++)if(Math.random()<.25)leds.setColorAt(i,cl.set(LC[Math.random()*LC.length|0]));leds.instanceColor.needsUpdate=true}
for(let i=0;i<9;i++)alerts.push(['--:--:--',Math.random()<.2?2:Math.random()<.5?1:0,AM[i]]);
tick();setInterval(tick,600);

// ---------- Robot movement helpers ----------
function moveRobot(rp,dt,t){
  const {r,pts,speed}=rp;
  const [tx,tz]=pts[rp.i];
  const dx=tx-r.position.x, dz=tz-r.position.z;
  const dist=Math.hypot(dx,dz);
  if(dist<.15){
    rp.i=(rp.i+1)%pts.length;
    return;
  }
  const nx=dx/dist, nz=dz/dist;
  r.position.x+=nx*speed*dt;
  r.position.z+=nz*speed*dt;
  r.position.y=0;
  // face direction of travel
  const targetYaw=Math.atan2(nx,nz);
  let dy=targetYaw-r.rotation.y;
  dy=Math.atan2(Math.sin(dy),Math.cos(dy));
  r.rotation.y+=dy*Math.min(1,dt*5);
  // walk animation
  const ud=r.userData;
  const walk=Math.sin(t*8+ud.phase);
  ud.armL.rotation.x=walk*.5;
  ud.armR.rotation.x=-walk*.5;
  ud.legL.rotation.x=-walk*.6;
  ud.legR.rotation.x=walk*.6;
  // bob
  r.position.y=Math.abs(Math.sin(t*8+ud.phase))*.04;
  // eye glow pulse
  const pulse=.6+.4*Math.sin(t*3+ud.phase);
  ud.glow.color.setHex(ud.eyeColor);
  ud.glow.opacity=pulse;
}
// make eye material transparent for pulsing
robots.forEach(r=>{const ud=r.userData;ud.glow.transparent=true;});

// ---------- Render Loop ----------
const clock=new T.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;

  // move robots
  robotPaths.forEach(rp=>moveRobot(rp,dt,t));

  // idle animation for people
  people.forEach(p=>{
    const ud=p.userData;
    // subtle breathing / head bob
    const b=Math.sin(t*1.5+ud.phase)*.012;
    p.position.y+=b*.05;
    // slight head turn
    ud.head.rotation.y=Math.sin(t*.7+ud.phase)*.15;
    // arm idle
    ud.armL.rotation.z=Math.sin(t*1.2+ud.phase)*.05;
    ud.armR.rotation.z=-Math.sin(t*1.2+ud.phase)*.05;
    // standing person leg shift
    if(!ud.seated && ud.legL){
      ud.legL.rotation.x=Math.sin(t*.8+ud.phase)*.05;
      ud.legR.rotation.x=-Math.sin(t*.8+ud.phase)*.05;
    }
  });

  if(tw){
    tw.t+=dt;
    if(tw.t<tw.dur){
      const k=ease(tw.t/tw.dur);
      pos.lerpVectors(tw.fp,tw.tp,k);yaw=tw.fy+(tw.ty-tw.fy)*k;pitch=tw.fpi+(tw.tpi-tw.fpi)*k;
    }else{
      pos.copy(tw.tp);
      const dw=tw.spin?16:8,h=tw.t-tw.dur;
      yaw=tw.spin?tw.ty-(h/dw)*Math.PI*2:tw.ty;pitch=tw.tpi;
      if(h>dw){tw=null;if(auto&&idx<S.length-1)goto(idx+1);else stopTour()}
    }
  }else{
    const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),
          r=(keys.KeyD?1:0)-(keys.KeyA?1:0),
          tr=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
    yaw-=tr*dt*1.6;
    if(f||r){if(auto)stopTour();pos.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*r)*2.2*dt;pos.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*r)*2.2*dt}
    pos.x=clamp(pos.x,-HW+.3,HW-.3);pos.z=clamp(pos.z,-HD+.3,HD-.3);
    pos.y+=(2.0+tier(pos.z)-pos.y)*Math.min(1,dt*8);
  }
  camera.position.copy(pos);camera.rotation.set(pitch,yaw,0);
  const on=Math.sin(t*5)>0;
  cams.forEach(c=>{c.rotation.y=c.userData.base+Math.sin(t*.5)*.3;c.userData.led.visible=on});
  beacon.rotation.y+=dt*4;
  renderer.render(scene,camera);
})();
</script>
